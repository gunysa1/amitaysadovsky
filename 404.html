<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page Not Found - Ella Amitay Sadovsky</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .error-container {
    text-align: center;
    padding: 100px 20px;
  }
  .error-code {
    font-size: 80px;
    color: #eee;
    margin-bottom: 10px;
  }
  .error-msg {
    font-size: 18px;
    color: #666;
    margin-bottom: 30px;
  }
  .back-home {
    display: inline-block;
    padding: 12px 25px;
    border: 1px solid #4a90a4;
    color: #4a90a4;
    text-decoration: none;
    transition: 0.3s;
  }
  .back-home:hover {
    background: #4a90a4;
    color: #fff;
  }
</style>
</head>
<body>

<main class="error-container">
  <div class="error-code">404</div>
  <h2 style="font-weight: normal;">Oops! That page seems to have vanished.</h2>
  <p class="error-msg">The link you followed may be broken, or the page may have been moved.</p>
  
  <a href="/index.html"="back-home">RETURN TO HOME</a>
</main>

</body>
</html>
